[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-finder"
version = "0.1.0"
description = "On-demand public vacancy search for Paraguay Concursa"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "pdfplumber>=0.11,<1",
    "playwright>=1.50,<2",
]

[project.scripts]
job-finder = "job_finder.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
